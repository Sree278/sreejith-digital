# Cloudflare Workers configuration: static assets + a tiny enquiry endpoint.
# Keep this file at the repository root; Workers Builds must use root directory "/".
name = "sreejith-digital"
main = "worker/index.js"
compatibility_date = "2026-11-26"
workers_dev = true
preview_urls = false

[assets]
directory = "./public/"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Only /api/* runs the Worker. Every page and asset is served directly.
run_worker_first = ["/api/*"]

[vars]
# Sender address on this domain. Email Routing must be enabled for the zone.
ENQUIRY_FROM = "website@sreejithdigital.com"
# Sender for the email-link check on the phone reveal (Brevo, domain authenticated).
# BREVO_API_KEY and VERIFY_SECRET are secrets set in the dashboard, never here.
VERIFY_FROM = "hello@sreejithdigital.com"
# ENQUIRY_TO is your verified destination inbox. Set it as a secret so it never
# appears in this public repository:  npx wrangler secret put ENQUIRY_TO

# Email Routing is on (27 Nov 2026) and the inbox is a verified destination.
# The Worker sends each enquiry to the ENQUIRY_TO secret. See DEPLOYMENT.md.
[[send_email]]
name = "ENQUIRY_EMAIL"

# Optional: keep a 180-day copy of each enquiry in Workers KV.
# [[kv_namespaces]]
# binding = "ENQUIRIES"
# id = "<your KV namespace id>"

# Daily cap and single-use links for the gated phone reveal (28 Nov 2026).
[[kv_namespaces]]
binding = "CONTACT_KV"
id = "86a54c16c6094c13bad6948ce0ceb2d9"

# Cloudflare creates this custom-domain DNS record and certificate on deploy.
[[routes]]
pattern = "sreejithdigital.com"
custom_domain = true
