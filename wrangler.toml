# Cloudflare Workers static-assets configuration.
# Keep this file at the repository root; Workers Builds must use root directory "/".
name = "sreejith-digital"
compatibility_date = "2026-11-26"
workers_dev = true
preview_urls = false

[assets]
directory = "./public/"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Cloudflare creates this custom-domain DNS record and certificate on deploy.
[[routes]]
pattern = "sreejithdigital.com"
custom_domain = true
